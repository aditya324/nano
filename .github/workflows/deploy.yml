name: Deploy Nano

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/sunrisedigital-nanoweb/htdocs/nanoweb.sunrisedigital.co.in

            git pull origin main

            composer install --no-dev --optimize-autoloader

            /usr/bin/php8.4 artisan migrate --force

            /usr/bin/php8.4 artisan optimize:clear
            /usr/bin/php8.4 artisan optimize

            /usr/bin/php8.4 artisan sitemap:generate